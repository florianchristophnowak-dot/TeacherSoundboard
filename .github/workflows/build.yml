name: Build Teacher Soundboard

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Erlaubt manuelles Auslösen

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TeacherSoundboard" soundboard.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeacherSoundboard-Windows
          path: dist/TeacherSoundboard.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "TeacherSoundboard" --osx-bundle-identifier "com.teachersoundboard.app" soundboard.py

      - name: Create DMG
        run: |
          # Erstelle einen einfachen DMG
          mkdir -p dmg_contents
          cp -r dist/TeacherSoundboard.app dmg_contents/ 2>/dev/null || cp dist/TeacherSoundboard dmg_contents/
          hdiutil create -volname "TeacherSoundboard" -srcfolder dmg_contents -ov -format UDZO dist/TeacherSoundboard.dmg || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeacherSoundboard-macOS
          path: |
            dist/TeacherSoundboard.app
            dist/TeacherSoundboard
            dist/TeacherSoundboard.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libegl1 \
            libgl1-mesa-glx \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "teachersoundboard" soundboard.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeacherSoundboard-Linux
          path: dist/teachersoundboard

  # Release erstellen wenn ein Tag gepusht wird
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -la artifacts/

      - name: Prepare release files
        run: |
          mkdir release
          # Windows
          cp artifacts/TeacherSoundboard-Windows/TeacherSoundboard.exe release/TeacherSoundboard-Windows.exe || true
          # macOS
          cd artifacts/TeacherSoundboard-macOS && zip -r ../../release/TeacherSoundboard-macOS.zip . && cd ../..
          # Linux
          cp artifacts/TeacherSoundboard-Linux/teachersoundboard release/TeacherSoundboard-Linux || true
          chmod +x release/TeacherSoundboard-Linux || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
