name: Build Teacher Soundboard

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teachersoundboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test source
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          $env:QT_QPA_PLATFORM = 'offscreen'
          python soundboard.py --self-test

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name TeacherSoundboard `
            --version-file installer/windows/version_info.txt `
            --collect-submodules pynput `
            --add-data "assets/icons;assets/icons" `
            soundboard.py

      - name: Test packaged application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:TEACHER_SOUNDBOARD_SELF_TEST_LOG = Join-Path $env:RUNNER_TEMP 'TeacherSoundboard-self-test.log'
          $process = Start-Process `
            -FilePath .\dist\TeacherSoundboard\TeacherSoundboard.exe `
            -ArgumentList '--self-test' `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:TEACHER_SOUNDBOARD_SELF_TEST_LOG) {
              Get-Content $env:TEACHER_SOUNDBOARD_SELF_TEST_LOG
            }
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }

      - name: Package Windows downloads
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\TeacherSoundboard -DestinationPath .\dist\TeacherSoundboard-Windows-x64.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc .\installer\windows\TeacherSoundboard.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path .\dist\TeacherSoundboard-Windows-x64-Setup.exe)) { throw "Installer output missing" }

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: TeacherSoundboard-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/TeacherSoundboard-Windows-x64-Setup.exe
            dist/TeacherSoundboard-Windows-x64.zip

  macos:
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: Apple-Silicon
            arch: arm64
          - runner: macos-15-intel
            label: Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          python -c "import platform; print(platform.platform(), platform.machine())"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v
          python soundboard.py --self-test

      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name TeacherSoundboard \
            --osx-bundle-identifier de.floriannowak.teachersoundboard \
            --target-architecture "${{ matrix.arch }}" \
            --collect-submodules pynput \
            --add-data "assets/icons:assets/icons" \
            soundboard.py

      - name: Finalize and sign app bundle
        run: |
          app="dist/TeacherSoundboard.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 4.5.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 4.5.0" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 4.5.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 4.5.0" "$plist"
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 12.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 12.0" "$plist"
          test "$(lipo -archs "$app/Contents/MacOS/TeacherSoundboard")" = "${{ matrix.arch }}"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Test packaged application
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/TeacherSoundboard.app/Contents/MacOS/TeacherSoundboard --self-test

      - name: Package macOS downloads
        run: |
          label="${{ matrix.label }}"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/TeacherSoundboard.app "dist/TeacherSoundboard-macOS-${label}.zip"
          mkdir -p build/dmg
          cp -R dist/TeacherSoundboard.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Teacher Soundboard" \
            -srcfolder build/dmg -ov -format UDZO \
            "dist/TeacherSoundboard-macOS-${label}.dmg"
          hdiutil verify "dist/TeacherSoundboard-macOS-${label}.dmg"

      - name: Upload macOS downloads
        uses: actions/upload-artifact@v4
        with:
          name: TeacherSoundboard-macOS-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/TeacherSoundboard-macOS-${{ matrix.label }}.dmg
            dist/TeacherSoundboard-macOS-${{ matrix.label }}.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -exec cp {} release/ \;
          test "$(find release -type f | wc -l)" -eq 6
          ls -lh release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes --title "Teacher Soundboard $GITHUB_REF_NAME"
          fi
